<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>بروستد أمين | Broasted Ameen</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary: #7f1d1d;
        --accent: #f59e0b;
        --whatsapp: #25d366;
        --bg: #fffbeb;
        --card-bg: #ffffff;
        --text: #1e293b;
        --text-light: #64748b;
        --danger: #ef4444;
        --warning: #f59e0b;
        --info: #3b82f6;
        --radius: 12px;
        --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 6px 12px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 15px 25px rgba(0, 0, 0, 0.1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.5;
        padding-bottom: env(safe-area-inset-bottom);
      }

      header {
        background: linear-gradient(135deg, #450a0a 0%, #7f1d1d 100%);
        color: white;
        text-align: center;
        padding: 1.5rem 1rem;
        margin-bottom: 1rem;
        position: relative;
        box-shadow: var(--shadow-sm);
        border-bottom: 4px solid var(--accent);
      }

      header h1 {
        font-size: 1.6rem;
        font-weight: 800;
        margin-bottom: 2px;
      }

      header p {
        font-size: 0.85rem;
        color: #fde68a;
      }

      .admin-trigger {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        max-width: 100%;
        margin: 0 auto;
        padding: 0 10px;
      }

      @media (min-width: 768px) {
        .container {
          max-width: 750px;
          padding: 0 16px;
        }
      }

      .categories-bar {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 2px 12px 2px;
        margin-bottom: 1rem;
        scrollbar-width: none;
      }
      .categories-bar::-webkit-scrollbar {
        display: none;
      }

      .cat-chip {
        background: #ffffff;
        border: 1px solid #fcd34d;
        color: var(--text-light);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
        transition: all 0.2s;
      }

      .cat-chip.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
        box-shadow: 0 2px 6px rgba(127, 29, 29, 0.3);
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 2rem;
      }

      @media (min-width: 768px) {
        .products-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 16px;
        }
      }

      .product-card {
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        border: 1px solid #fef3c7;
        position: relative;
        transition: transform 0.2s ease;
      }

      .product-card:active {
        transform: scale(0.97);
      }

      .card-img-container {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background-color: #fef9c3;
        overflow: hidden;
      }

      .card-img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .img-badge {
        position: absolute;
        bottom: 8px;
        left: 8px;
        background: rgba(69, 10, 10, 0.8);
        backdrop-filter: blur(4px);
        color: white;
        padding: 2px 6px;
        font-size: 0.65rem;
        border-radius: 4px;
        font-weight: 600;
      }

      .product-badges {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 5;
      }

      .badge {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        font-size: 0.68rem;
        font-weight: 800;
        border-radius: 12px;
        color: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }

      .badge-sale {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      }
      .badge-featured {
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      }

      .card-content {
        padding: 10px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      .product-title {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 4px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        line-height: 1.3;
      }

      .product-price {
        font-size: 1rem;
        color: #d97706;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .whatsapp-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background-color: var(--whatsapp);
        color: white;
        text-decoration: none;
        padding: 8px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.78rem;
        margin-top: auto;
        box-shadow: 0 2px 4px rgba(37, 211, 102, 0.2);
      }

      #product-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(69, 10, 10, 0.8);
        z-index: 1000;
        justify-content: center;
        align-items: flex-end;
      }

      @media (min-width: 768px) {
        #product-modal {
          align-items: center;
          padding: 1rem;
        }
      }

      .modal-content {
        background: white;
        width: 100%;
        max-width: 600px;
        border-radius: 20px 20px 0 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        max-height: 92vh;
        position: relative;
        box-shadow: var(--shadow-lg);
      }

      @media (min-width: 768px) {
        .modal-content {
          border-radius: 16px;
        }
      }

      .close-modal {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(69, 10, 10, 0.6);
        color: white;
        border: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font-size: 1.1rem;
        cursor: pointer;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-slider-container {
        position: relative;
        width: 100%;
        height: 280px;
        background-color: #fef9c3;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-slider-container img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: none;
      }

      .modal-slider-container img.active {
        display: block;
      }

      .modal-slider-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.9);
        color: var(--primary);
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        z-index: 5;
      }
      .modal-prev {
        right: 10px;
      }
      .modal-next {
        left: 10px;
      }

      .modal-thumbnails {
        display: flex;
        gap: 6px;
        padding: 8px;
        background: #fffbeb;
        overflow-x: auto;
        justify-content: center;
        border-bottom: 1px solid #fef3c7;
      }

      .modal-thumb {
        width: 48px;
        height: 48px;
        border-radius: 6px;
        object-fit: cover;
        cursor: pointer;
        opacity: 0.5;
        border: 2px solid transparent;
      }
      .modal-thumb.active {
        opacity: 1;
        border-color: var(--accent);
      }

      .modal-body {
        padding: 1rem;
        overflow-y: auto;
      }

      .modal-header-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 6px;
      }

      .modal-title {
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--primary);
      }

      .share-btn {
        background: #fffbeb;
        color: var(--primary);
        border: 1px solid #fcd34d;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 700;
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .modal-price {
        font-size: 1.1rem;
        color: #d97706;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .modal-desc {
        font-size: 0.88rem;
        color: var(--text-light);
        margin-bottom: 1rem;
        white-space: pre-line;
        line-height: 1.6;
      }

      #login-modal,
      #admin-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(69, 10, 10, 0.8);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 12px;
      }

      .login-content,
      .admin-content {
        background: white;
        width: 100%;
        max-width: 500px;
        border-radius: var(--radius);
        padding: 1.25rem;
        position: relative;
        box-shadow: var(--shadow-lg);
        max-height: 90vh;
        overflow-y: auto;
      }

      .close-admin {
        background: #fffbeb;
        border: 1px solid #fcd34d;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        font-size: 1rem;
        cursor: pointer;
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .form-group {
        margin-bottom: 0.85rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 4px;
        font-weight: 700;
        font-size: 0.82rem;
        color: var(--primary);
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 0.65rem;
        border: 1px solid #fcd34d;
        border-radius: 8px;
        font-size: 0.9rem;
        background: #fffbeb;
      }

      .checkbox-group {
        display: flex;
        gap: 12px;
        background: #fffbeb;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #fcd34d;
      }

      .checkbox-group label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        margin-bottom: 0 !important;
      }

      .images-preview-grid {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 6px;
      }

      .preview-thumb-box {
        position: relative;
        width: 55px;
        height: 55px;
        border-radius: 6px;
        overflow: hidden;
        border: 2px solid #fcd34d;
        background: #fef9c3;
      }
      .preview-thumb-box.is-primary {
        border-color: var(--primary);
      }
      .preview-thumb-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .preview-thumb-actions {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(69, 10, 10, 0.8);
        display: flex;
        justify-content: space-around;
        padding: 2px 0;
      }
      .preview-thumb-actions button {
        background: none;
        border: none;
        color: white;
        font-size: 0.65rem;
        cursor: pointer;
      }

      .primary-tag-badge {
        position: absolute;
        top: 2px;
        right: 2px;
        background: var(--primary);
        color: white;
        font-size: 0.55rem;
        padding: 1px 3px;
        border-radius: 3px;
        font-weight: 700;
      }

      .admin-btn {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 0.75rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        width: 100%;
        font-size: 0.9rem;
        margin-top: 6px;
      }

      .cancel-edit-btn {
        background-color: #64748b;
        color: white;
        border: none;
        padding: 0.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.8rem;
        display: none;
        width: 100%;
        margin-top: 6px;
      }

      .admin-products-list {
        margin-top: 1rem;
        border-top: 1px solid #fef3c7;
        padding-top: 1rem;
        max-height: 250px;
        overflow-y: auto;
      }

      .admin-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fffbeb;
        border: 1px solid #fcd34d;
        padding: 8px 10px;
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 0.82rem;
        gap: 8px;
      }

      .admin-item-info {
        flex-grow: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .admin-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      .admin-actions button {
        border: none;
        padding: 5px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.72rem;
        color: white;
        font-weight: 700;
      }
      .view-btn {
        background-color: var(--info);
      }
      .edit-btn {
        background-color: var(--warning);
      }
      .delete-btn {
        background-color: var(--danger);
      }

      .logout-btn {
        background-color: var(--danger);
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 700;
        cursor: pointer;
      }

      /* تنسيقات الفوتر المحدثة */
      footer {
        background: #450a0a;
        color: #ffffff;
        padding: 1.5rem 1rem;
        text-align: center;
        border-top: 4px solid var(--accent);
      }

      .footer-brand {
        font-size: 0.85rem;
        color: #fde68a;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .footer-socials {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 15px;
      }

      .footer-socials a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border-radius: 50%;
        font-size: 1.1rem;
        transition: all 0.2s;
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-decoration: none;
      }

      .footer-socials a:hover {
        background: var(--accent);
        color: #450a0a;
        transform: translateY(-2px);
      }

      .footer-map {
        width: 100%;
        height: 200px;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .footer-map iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      #loading-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(69, 10, 10, 0.8);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 0.9rem;
        flex-direction: column;
        gap: 10px;
        font-weight: 600;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #toast-notification {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background-color: var(--primary);
        color: white;
        padding: 10px 18px;
        border-radius: 10px;
        z-index: 3000;
        font-size: 0.85rem;
        font-weight: 700;
        transition: transform 0.3s ease;
        box-shadow: var(--shadow-md);
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--accent);
      }
      #toast-notification.show {
        transform: translateX(-50%) translateY(0);
      }
      #toast-notification.error {
        background-color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div id="toast-notification">
      <i class="fa-solid fa-check-circle"></i>
      <span id="toast-text">تمت العملية بنجاح</span>
    </div>

    <header>
      <button class="admin-trigger" onclick="openLoginModal()">
        <i class="fa-solid fa-gear"></i>
      </button>
      <div class="container">
        <h1>بروستد أمين</h1>
        <p>أهلاً بكم - الطعم الذهبي المقرمش 🍗</p>
      </div>
    </header>

    <main class="container">
      <div id="categories-bar" class="categories-bar">
        <div class="cat-chip active" onclick="filterCategory('all', this)">
          الكل
        </div>
        <div class="cat-chip" onclick="filterCategory('بروستد', this)">
          بروستد
        </div>
        <div class="cat-chip" onclick="filterCategory('وجبات دجاج', this)">
          وجبات دجاج
        </div>
        <div class="cat-chip" onclick="filterCategory('مأكولات بحرية', this)">
          مأكولات بحرية
        </div>
        <div class="cat-chip" onclick="filterCategory('مقبلات وإضافات', this)">
          مقبلات وإضافات
        </div>
      </div>

      <section>
        <div id="products-grid" class="products-grid"></div>
      </section>
    </main>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <span id="loading-text">جاري معالجة الصور...</span>
    </div>

    <div id="login-modal">
      <div class="login-content">
        <h2
          style="
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          تسجيل دخول المشرف
          <button class="close-admin" onclick="closeLoginModal()">
            &times;
          </button>
        </h2>
        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>البريد الإلكتروني:</label>
            <input
              type="email"
              id="login-email"
              required
              placeholder="admin@ameen.com"
            />
          </div>
          <div class="form-group">
            <label>كلمة المرور:</label>
            <input
              type="password"
              id="login-password"
              required
              placeholder="********"
            />
          </div>
          <button type="submit" class="admin-btn">دخول</button>
        </form>
      </div>
    </div>

    <div id="product-modal">
      <div class="modal-content">
        <button class="close-modal" onclick="closeProductModal()">
          &times;
        </button>
        <div class="modal-slider-container" id="modal-slider"></div>
        <div class="modal-thumbnails" id="modal-thumbnails"></div>
        <div class="modal-body">
          <div class="modal-header-row">
            <h2 class="modal-title" id="modal-title"></h2>
            <button class="share-btn" onclick="shareCurrentProduct()">
              <i class="fa-solid fa-share-nodes"></i> مشاركة
            </button>
          </div>
          <div class="modal-price" id="modal-price"></div>
          <p class="modal-desc" id="modal-desc"></p>
          <a
            id="modal-whatsapp-btn"
            href="#"
            target="_blank"
            class="whatsapp-btn"
          >
            <i class="fa-brands fa-whatsapp" style="font-size: 1.1rem"></i> اطلب
            الآن عبر الواتساب
          </a>
        </div>
      </div>
    </div>

    <div id="admin-modal">
      <div class="admin-content">
        <button
          class="close-admin"
          style="float: left"
          onclick="closeAdminPanel()"
        >
          &times;
        </button>
        <h2
          id="admin-form-title"
          style="font-size: 1.1rem; margin-bottom: 1rem; color: var(--primary)"
        >
          إدارة المنيو
        </h2>

        <form id="product-form" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="editing-product-id" value="" />
          <div class="form-group">
            <label>اسم الوجبة:</label>
            <input
              type="text"
              id="p-name"
              required
              placeholder="مثال: بروستد عادي / ستيليس"
            />
          </div>
          <div class="form-group">
            <label>القسم:</label>
            <select id="p-category" required>
              <option value="بروستد">بروستد</option>
              <option value="وجبات دجاج">وجبات دجاج</option>
              <option value="مأكولات بحرية">مأكولات بحرية</option>
              <option value="مقبلات وإضافات">مقبلات وإضافات</option>
            </select>
          </div>
          <div class="form-group">
            <label>السعر (ر.س):</label>
            <input type="number" id="p-price" required placeholder="20" />
          </div>
          <div class="form-group">
            <label>مكونات أو وصف الوجبة:</label>
            <textarea
              id="p-desc"
              rows="2"
              placeholder="مكونات الوجبة، الإضافات..."
            ></textarea>
          </div>
          <div class="form-group">
            <label>شارات الوجبة:</label>
            <div class="checkbox-group">
              <label><input type="checkbox" id="p-featured" /> ⭐ مميز</label>
              <label
                ><input type="checkbox" id="p-discount" /> 🏷️ عرض خاص</label
              >
            </div>
          </div>
          <div class="form-group">
            <label>صور الوجبة:</label>
            <input type="file" id="p-images" accept="image/*" multiple />
            <div id="current-images-preview" class="images-preview-grid"></div>
          </div>
          <button type="submit" id="admin-submit-btn" class="admin-btn">
            حفظ ونشر في المنيو
          </button>
          <button
            type="button"
            id="cancel-edit-btn"
            class="cancel-edit-btn"
            onclick="resetProductForm()"
          >
            إلغاء التعديل
          </button>
        </form>

        <div class="admin-products-list">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 8px;
            "
          >
            <span
              style="
                font-size: 0.85rem;
                font-weight: 700;
                color: var(--primary);
              "
              >الوجبات المسجلة</span
            >
            <button type="button" onclick="logoutAdmin()" class="logout-btn">
              <i class="fa-solid fa-right-from-bracket"></i> خروج
            </button>
          </div>
          <div id="admin-list-container"></div>
        </div>
      </div>
    </div>

    <!-- الفوتر المحدث مع الأيقونات والخريطة -->
    <footer>
      <!-- <div class="footer-brand">بروستد أمين | للإستفسار والطلب: 0510014106</div> -->

      <div class="footer-socials">
        <a href="https://snapchat.com" target="_blank" title="سناب شات"
          ><i class="fa-brands fa-snapchat"></i
        ></a>
        <a href="https://instagram.com" target="_blank" title="انستغرام"
          ><i class="fa-brands fa-instagram"></i
        ></a>
        <a href="https://tiktok.com" target="_blank" title="تيك توك"
          ><i class="fa-brands fa-tiktok"></i
        ></a>
      </div>

      <div class="footer-map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3577.428546053802!2d50.211179173643174!3d26.28020398698938!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e49e9d1a2cd372f%3A0xa5594814bd2e115c!2zQU1FRU4gQlJPQVNURUQg2KjYsdmI2LPYqtivINij2YXZitmG!5e0!3m2!1sen!2ssa!4v1789518262587!5m2!1sen!2ssa"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
    </footer>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        doc
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        signOut
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const PHONE_NUMBER = "966510014106";

      const firebaseConfig = {
        apiKey: "AIzaSyA5HcEPCIYy61ec4_tlYMo7tZJVVKSrmuY",
        authDomain: "amin-86f08.firebaseapp.com",
        projectId: "amin-86f08",
        storageBucket: "amin-86f08.firebasestorage.app",
        messagingSenderId: "622374850244",
        appId: "1:622374850244:web:3dce98962d5a2389de4391",
        measurementId: "G-3X67WE7480"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      let globalProducts = [];
      let workingImagesArray = [];
      let activeSelectedProduct = null;
      let currentActiveCategory = "all";

      function showToast(message, isError = false) {
        const toast = document.getElementById("toast-notification");
        document.getElementById("toast-text").innerText = message;
        toast.className = isError ? "error show" : "show";
        setTimeout(() => {
          toast.className = "";
        }, 2500);
      }

      async function fetchProducts() {
        try {
          const querySnapshot = await getDocs(collection(db, "products"));
          globalProducts = [];
          querySnapshot.forEach((docSnap) => {
            globalProducts.push({ id: docSnap.id, ...docSnap.data() });
          });
          filterCategory(currentActiveCategory, null, false);
          renderAdminList(globalProducts);
          checkUrlHashForProduct();
        } catch (error) {
          console.error(error);
          showToast("خطأ في جلب بيانات المنيو", true);
        }
      }

      window.filterCategory = function (category, element, updateStyle = true) {
        currentActiveCategory = category;
        if (updateStyle && element) {
          document
            .querySelectorAll(".cat-chip")
            .forEach((c) => c.classList.remove("active"));
          element.classList.add("active");
        }

        let filtered = globalProducts;
        if (category !== "all") {
          filtered = globalProducts.filter((p) => p.category === category);
        }
        renderProducts(filtered);
      };

      function renderProducts(products) {
        const gridContainer = document.getElementById("products-grid");
        gridContainer.innerHTML = "";
        if (products.length === 0) {
          gridContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#64748b; font-size:0.88rem; padding: 2rem;">لا توجد وجبات مضافة في هذا القسم حالياً.</p>`;
          return;
        }

        products.forEach((product) => {
          const card = document.createElement("div");
          card.className = "product-card";
          card.onclick = () => openProductModal(product.id);

          let firstImg = product.images?.[0] || "";
          let imgCount = product.images?.length || 0;

          let badgesHtml = '<div class="product-badges">';
          if (product.hasDiscount)
            badgesHtml +=
              '<span class="badge badge-sale"><i class="fa-solid fa-tags"></i> عرض خاص</span>';
          if (product.isFeatured)
            badgesHtml +=
              '<span class="badge badge-featured"><i class="fa-solid fa-star"></i> مميز</span>';
          badgesHtml += "</div>";

          card.innerHTML = `
            <div class="card-img-container">
              ${badgesHtml}
              <img src="${firstImg}" alt="${product.name}" loading="lazy">
              ${imgCount > 1 ? `<span class="img-badge"><i class="fa-regular fa-images"></i> ${imgCount}</span>` : ""}
            </div>
            <div class="card-content">
              <h3 class="product-title">${product.name}</h3>
              <div class="product-price">${product.price} ر.س</div>
              <div class="whatsapp-btn" style="pointer-events: none;">
                <i class="fa-brands fa-whatsapp"></i> اطلب الآن
              </div>
            </div>
          `;
          gridContainer.appendChild(card);
        });
      }

      let currentModalImages = [];
      let currentModalIndex = 0;

      window.openProductModal = function (productId) {
        const product = globalProducts.find((p) => p.id === productId);
        if (!product) return;

        activeSelectedProduct = product;
        currentModalImages = product.images || [];
        currentModalIndex = 0;

        const baseUrl = window.location.href.split("#")[0].split("?")[0];
        const productUrl = `${baseUrl}#meal-${product.id}`;

        document.getElementById("modal-title").innerText = product.name;
        document.getElementById("modal-price").innerText =
          `${product.price} ريال سعودي`;
        document.getElementById("modal-desc").innerText =
          product.description || "وجبة شهية ومميزة من بروستد أمين.";

        const message = `مرحباً بروستد أمين، أرغب في طلب هذه الوجبة:\n\n*الوجبة:* ${product.name}\n*السعر:* ${product.price} ريال\n*الرابط:* ${productUrl}`;
        document.getElementById("modal-whatsapp-btn").href =
          `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`;

        updateModalSlider();
        document.getElementById("product-modal").style.display = "flex";
      };

      window.shareCurrentProduct = async function () {
        if (!activeSelectedProduct) return;
        const baseUrl = window.location.href.split("#")[0].split("?")[0];
        const productUrl = `${baseUrl}#meal-${activeSelectedProduct.id}`;
        const shareText = `اطلب معنا من بروستد أمين:\n${activeSelectedProduct.name} - السعر: ${activeSelectedProduct.price} ريال\n${productUrl}`;

        if (navigator.share) {
          try {
            await navigator.share({
              title: activeSelectedProduct.name,
              text: shareText,
              url: productUrl
            });
          } catch (err) {
            if (err.name !== "AbortError") fallbackCopyLink(productUrl);
          }
        } else {
          fallbackCopyLink(productUrl);
        }
      };

      function fallbackCopyLink(url) {
        navigator.clipboard
          .writeText(url)
          .then(() => {
            showToast("📋 تم نسخ رابط الوجبة بنجاح!");
          })
          .catch(() => {
            prompt("انسخ الرابط:", url);
          });
      }

      function checkUrlHashForProduct() {
        const hash = window.location.hash;
        if (hash.startsWith("#meal-")) {
          const productId = hash.replace("#meal-", "");
          if (globalProducts.some((p) => p.id === productId))
            openProductModal(productId);
        }
      }

      function updateModalSlider() {
        const sliderContainer = document.getElementById("modal-slider");
        const thumbnailsContainer = document.getElementById("modal-thumbnails");
        sliderContainer.innerHTML = "";
        thumbnailsContainer.innerHTML = "";

        if (currentModalImages.length === 0) return;

        currentModalImages.forEach((imgUrl, idx) => {
          const img = document.createElement("img");
          img.src = imgUrl;
          if (idx === currentModalIndex) img.className = "active";
          sliderContainer.appendChild(img);
        });

        if (currentModalImages.length > 1) {
          const prevBtn = document.createElement("button");
          prevBtn.className = "modal-slider-btn modal-prev";
          prevBtn.innerHTML = `<i class="fa-solid fa-chevron-right"></i>`;
          prevBtn.onclick = (e) => {
            e.stopPropagation();
            changeModalSlide(-1);
          };

          const nextBtn = document.createElement("button");
          nextBtn.className = "modal-slider-btn modal-next";
          nextBtn.innerHTML = `<i class="fa-solid fa-chevron-left"></i>`;
          nextBtn.onclick = (e) => {
            e.stopPropagation();
            changeModalSlide(1);
          };

          sliderContainer.appendChild(prevBtn);
          sliderContainer.appendChild(nextBtn);

          currentModalImages.forEach((imgUrl, idx) => {
            const thumb = document.createElement("img");
            thumb.src = imgUrl;
            thumb.className = `modal-thumb ${idx === currentModalIndex ? "active" : ""}`;
            thumb.onclick = () => {
              currentModalIndex = idx;
              updateModalSlider();
            };
            thumbnailsContainer.appendChild(thumb);
          });
        }
      }

      window.changeModalSlide = function (dir) {
        currentModalIndex =
          (currentModalIndex + dir + currentModalImages.length) %
          currentModalImages.length;
        updateModalSlider();
      };

      window.closeProductModal = function () {
        document.getElementById("product-modal").style.display = "none";
        activeSelectedProduct = null;
        if (window.location.hash.startsWith("#meal-"))
          history.pushState("", document.title, window.location.pathname);
      };

      window.onclick = function (e) {
        if (e.target === document.getElementById("product-modal"))
          closeProductModal();
        if (e.target === document.getElementById("admin-modal"))
          closeAdminPanel();
        if (e.target === document.getElementById("login-modal"))
          closeLoginModal();
      };

      function compressImage(
        file,
        maxWidth = 700,
        maxHeight = 700,
        quality = 0.7
      ) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              let w = img.width,
                h = img.height;
              if (w > h && w > maxWidth) {
                h = Math.round((h * maxWidth) / w);
                w = maxWidth;
              } else if (h > maxHeight) {
                w = Math.round((w * maxHeight) / h);
                h = maxHeight;
              }
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              canvas.getContext("2d").drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.onerror = reject;
          };
          reader.onerror = reject;
        });
      }

      function renderWorkingImagesPreview() {
        const container = document.getElementById("current-images-preview");
        container.innerHTML = "";
        workingImagesArray.forEach((imgUrl, index) => {
          const box = document.createElement("div");
          box.className = `preview-thumb-box ${index === 0 ? "is-primary" : ""}`;
          box.innerHTML = `
            <img src="${imgUrl}">
            ${index === 0 ? '<span class="primary-tag-badge">رئيسية</span>' : ""}
            <div class="preview-thumb-actions">
              ${index !== 0 ? `<button type="button" onclick="makeImagePrimary(${index})"><i class="fa-solid fa-star"></i></button>` : ""}
              <button type="button" onclick="removeWorkingImage(${index})"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
          container.appendChild(box);
        });
      }

      window.makeImagePrimary = function (idx) {
        const img = workingImagesArray.splice(idx, 1)[0];
        workingImagesArray.unshift(img);
        renderWorkingImagesPreview();
      };

      window.removeWorkingImage = function (idx) {
        workingImagesArray.splice(idx, 1);
        renderWorkingImagesPreview();
      };

      window.handleFormSubmit = async function (e) {
        e.preventDefault();
        const editingId = document.getElementById("editing-product-id").value;
        const name = document.getElementById("p-name").value;
        const category = document.getElementById("p-category").value;
        const price = Number(document.getElementById("p-price").value);
        const description = document.getElementById("p-desc").value;
        const isFeatured = document.getElementById("p-featured").checked;
        const hasDiscount = document.getElementById("p-discount").checked;
        const imageFiles = document.getElementById("p-images").files;

        const loadingOverlay = document.getElementById("loading-overlay");
        const loadingText = document.getElementById("loading-text");

        try {
          if (imageFiles.length > 0) {
            loadingOverlay.style.display = "flex";
            for (let i = 0; i < imageFiles.length; i++) {
              loadingText.innerText = `ضغط الصورة ${i + 1}/${imageFiles.length}...`;
              const compressed = await compressImage(imageFiles[i]);
              workingImagesArray.push(compressed);
            }
          }
          if (workingImagesArray.length === 0) {
            loadingOverlay.style.display = "none";
            showToast("أرفق صورة واحدة على الأقل للوجبة!", true);
            return;
          }

          loadingText.innerText = "جاري حفظ البيانات...";
          loadingOverlay.style.display = "flex";

          const productData = {
            name,
            category,
            price,
            description,
            isFeatured,
            hasDiscount,
            images: workingImagesArray
          };

          if (editingId) {
            await updateDoc(doc(db, "products", editingId), productData);
            showToast("تم تحديث الوجبة بنجاح!");
          } else {
            productData.createdAt = Date.now();
            await addDoc(collection(db, "products"), productData);
            showToast("تم إضافة الوجبة للمنيو بنجاح!");
          }

          loadingOverlay.style.display = "none";
          resetProductForm();
          fetchProducts();
        } catch (err) {
          loadingOverlay.style.display = "none";
          showToast("خطأ: " + err.message, true);
        }
      };

      window.prepareEditProduct = function (id) {
        const product = globalProducts.find((p) => p.id === id);
        if (!product) return;
        document.getElementById("editing-product-id").value = product.id;
        document.getElementById("p-name").value = product.name;
        document.getElementById("p-category").value =
          product.category || "بروستد";
        document.getElementById("p-price").value = product.price;
        document.getElementById("p-desc").value = product.description || "";
        document.getElementById("p-featured").checked =
          product.isFeatured || false;
        document.getElementById("p-discount").checked =
          product.hasDiscount || false;
        workingImagesArray = product.images ? [...product.images] : [];
        renderWorkingImagesPreview();
        document.getElementById("admin-form-title").innerText = "تعديل الوجبة";
        document.getElementById("admin-submit-btn").innerText = "حفظ التعديلات";
        document.getElementById("cancel-edit-btn").style.display = "block";
      };

      window.resetProductForm = function () {
        document.getElementById("product-form").reset();
        document.getElementById("editing-product-id").value = "";
        document.getElementById("admin-form-title").innerText = "إدارة المنيو";
        document.getElementById("admin-submit-btn").innerText =
          "حفظ ونشر في المنيو";
        document.getElementById("cancel-edit-btn").style.display = "none";
        workingImagesArray = [];
        document.getElementById("current-images-preview").innerHTML = "";
      };

      function renderAdminList(products) {
        const container = document.getElementById("admin-list-container");
        container.innerHTML = "";
        products.forEach((product) => {
          const item = document.createElement("div");
          item.className = "admin-item";
          item.innerHTML = `
            <div class="admin-item-info"><b>${product.name}</b> (${product.price} ر.س)</div>
            <div class="admin-actions">
              <button class="edit-btn" onclick="prepareEditProduct('${product.id}')">تعديل</button>
              <button class="delete-btn" onclick="deleteProduct('${product.id}')">حذف</button>
            </div>
          `;
          container.appendChild(item);
        });
      }

      window.deleteProduct = async function (id) {
        if (confirm("هل أنت متأكد من حذف هذه الوجبة؟")) {
          await deleteDoc(doc(db, "products", id));
          showToast("تم الحذف بنجاح!");
          fetchProducts();
        }
      };

      window.openLoginModal = () =>
        (document.getElementById("login-modal").style.display = "flex");
      window.closeLoginModal = () =>
        (document.getElementById("login-modal").style.display = "none");

      window.handleLogin = async function (e) {
        e.preventDefault();
        try {
          await signInWithEmailAndPassword(
            auth,
            document.getElementById("login-email").value,
            document.getElementById("login-password").value
          );
          closeLoginModal();
          document.getElementById("login-form").reset();
          document.getElementById("admin-modal").style.display = "flex";
          showToast("تم الدخول بنجاح!");
          fetchProducts();
        } catch (err) {
          showToast("خطأ في بيانات الدخول", true);
        }
      };

      window.logoutAdmin = async () => {
        await signOut(auth);
        closeAdminPanel();
        showToast("تم تسجيل الخروج");
      };

      window.closeAdminPanel = () => {
        document.getElementById("admin-modal").style.display = "none";
        resetProductForm();
        fetchProducts();
      };

      document.addEventListener("DOMContentLoaded", fetchProducts);
    </script>
  </body>
